<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메모장</title>
    <link rel="stylesheet" href="./css/index.css">
    <script src="./marked.min.js"></script>
</head>
<body>

<!-- 연결 오버레이 -->
<div id="overlay" style="display:none;">
    <p id="overlay-title">notebook 폴더에 연결합니다.</p>
    <p class="path">G:\내 드라이브\notebook\memos</p>
    <button class="btn-primary">연결</button>
</div>

<!-- 새 파일 모달 -->
<div id="new-file-modal" style="display:none;">
    <div class="modal-box">
        <h3 id="new-file-modal-title">새 파일 만들기</h3>
        <input type="text" id="new-file-name" placeholder="파일 제목 (예: 회의록)" />
        <div class="modal-actions">
            <button type="button" class="btn-cancel">취소</button>
            <button type="button" class="btn-create">만들기</button>
        </div>
    </div>
</div>

<!-- 새 폴더 모달 -->
<div id="new-folder-modal" style="display:none;">
    <div class="modal-box">
        <h3>새 폴더 만들기</h3>
        <input type="text" id="new-folder-name" placeholder="폴더 이름 (예: 프로젝트)" />
        <div class="modal-actions">
            <button type="button" class="btn-cancel">취소</button>
            <button type="button" class="btn-create">만들기</button>
        </div>
    </div>
</div>

<div class="layout">

    <!-- 왼쪽: 파일 목록 -->
    <aside class="sidebar-left">
        <div class="sidebar-logo">
            <a href="#">로컬메모장</a>
            <span id="save-status"></span>
        </div>
        <div class="sidebar-search">
            <input type="search" id="file-search" placeholder="파일 검색…" autocomplete="off" spellcheck="false" />
            <button type="button" id="file-search-clear" class="file-search-clear" title="검색 지우기" hidden aria-label="검색 지우기">×</button>
        </div>
        <nav class="sidebar-nav" id="file-tabs"></nav>
        <div class="sidebar-footer">
            <button type="button" class="btn-new">+ 새 파일</button>
            <button type="button" class="btn-new-folder">+ 새 폴더</button>
            <button type="button" class="btn-reconnect" title="폴더 재연결">⟳</button>
        </div>
    </aside>

    <!-- 왼쪽 사이드바 ↔ 에디터 너비 조절 -->
    <div class="layout-splitter" id="splitter-left" role="separator" aria-orientation="vertical" aria-label="파일 목록 너비 조절" title="드래그하여 너비 조절 · 더블클릭 시 기본 너비"></div>

    <!-- 중앙: 에디터 -->
    <main class="content">
        <div class="content-body">
            <div id="memo-editor" contenteditable="false" spellcheck="false"></div>
        </div>
    </main>

    <!-- 오른쪽: TOC -->
    <aside class="sidebar-right">
        <div class="toc-title">이 페이지에서</div>
        <nav id="toc"></nav>
    </aside>

</div>

<script src="./js/state.js"></script>
<script src="./js/db.js"></script>
<script src="./js/toc.js"></script>
<script src="./js/renderer.js"></script>
<script src="./js/files.js"></script>
<script src="./js/modal.js"></script>
<script src="./js/editor.js"></script>
<script src="./js/layout.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
